<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bg)" stroke="url(#neon)" stroke-width="8"/>
  
  <!-- DJ Platter Outer Rim -->
  <circle cx="256" cy="256" r="160" fill="#111827" stroke="#374151" stroke-width="6"/>
  <circle cx="256" cy="256" r="148" fill="#1f2937" stroke="#06b6d4" stroke-width="4" stroke-dasharray="8 6" filter="url(#glow)"/>
  
  <!-- Grooves -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="#374151" stroke-width="2"/>
  
  <!-- Center Platter Plate -->
  <circle cx="256" cy="256" r="65" fill="#e11d48"/>
  <circle cx="256" cy="256" r="50" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="18" fill="#030712"/>

  <!-- LED Underglow Bar -->
  <rect x="96" y="420" width="320" height="20" rx="10" fill="url(#neon)" filter="url(#glow)"/>
</svg>
